# Both directions through the packaged connector: read the seeded table, write an append output.
# auth: none is only valid with endpoint set -- meaningful against the emulator, never against Google.
bq:
  connector: bigquery
  project: test
  auth: none
  endpoint: ${BQ_REST}
  storage_endpoint: ${BQ_GRPC}
  staging_dataset: e2e
  entities:
    orders_in:
      read:
        entity: e2e.orders_in
        # The emulator's Storage Read API grants exactly one stream regardless of what is asked
        # for ("currently supported only one stream"); real BigQuery grants as many as it likes.
        streams: 1
    orders_out:
      write:
        entity: e2e.orders_out
        strategy: append
