# Interpolated from the environment by `pz connector test --config`, the same way connections.yml
# is: the CI job exports BQ_REST/BQ_GRPC for both.
connection:
  project: test
  auth: none
  endpoint: ${BQ_REST}
  storage_endpoint: ${BQ_GRPC}
  staging_dataset: e2e
read:
  dataset: e2e.orders_in
  # The emulator's Storage Read API grants exactly one stream regardless of what is asked for.
  streams: 1
write:
  output: e2e.e2e_probe
  mode: append
